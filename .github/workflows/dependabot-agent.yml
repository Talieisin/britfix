# managed-by: talieisin-org-bootstrap v6
# Fires when the org dispatcher labels a major Dependabot PR `ai-upgrade`,
# and when it dispatches a response round for a Copilot review.
# All logic lives in the org's shared reusable workflows; operational
# documentation is internal.
name: AI upgrade
# Quoted: an unquoted ' #' would start a YAML comment mid-expression.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Copilot response PR #{0} review {1}', inputs.pr-number, inputs.review-id) || github.event.pull_request.title }}"
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Dependabot PR to respond on
        required: true
        type: string
      review-id:
        description: Copilot review to respond to
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: write
  actions: read
  statuses: read # rescue mode: legacy commit-status comparison

jobs:
  upgrade:
    if: github.event_name == 'pull_request' && github.event.label.name == 'ai-upgrade'
    uses: Talieisin/.github/.github/workflows/dependabot-upgrade.yml@main
    with:
      setup: uv
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
      TALIEISIN_CODEX_APP_ID: ${{ secrets.TALIEISIN_CODEX_APP_ID }}
      TALIEISIN_CODEX_APP_PRIVATE_KEY: ${{ secrets.TALIEISIN_CODEX_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TALIEISIN_AUTOMATION_APP_ID: ${{ secrets.TALIEISIN_AUTOMATION_APP_ID }}
      TALIEISIN_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.TALIEISIN_AUTOMATION_APP_PRIVATE_KEY }}
      TALIEISIN_TRIGGER_APP_ID: ${{ secrets.TALIEISIN_TRIGGER_APP_ID }}
      TALIEISIN_TRIGGER_APP_PRIVATE_KEY: ${{ secrets.TALIEISIN_TRIGGER_APP_PRIVATE_KEY }}

  copilot-response:
    if: github.event_name == 'workflow_dispatch'
    uses: Talieisin/.github/.github/workflows/copilot-response.yml@main
    with:
      setup: uv
      pr-number: ${{ inputs.pr-number }}
      review-id: ${{ inputs.review-id }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TALIEISIN_AUTOMATION_APP_ID: ${{ secrets.TALIEISIN_AUTOMATION_APP_ID }}
      TALIEISIN_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.TALIEISIN_AUTOMATION_APP_PRIVATE_KEY }}
